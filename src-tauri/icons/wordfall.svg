<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Wordfall: five streaks of rain whose drops trace a "W", on deep blue water. -->
  <defs>
    <linearGradient id="sea" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#3a86ee"/>
      <stop offset="0.5" stop-color="#1a4fb0"/>
      <stop offset="1" stop-color="#0a1d47"/>
    </linearGradient>
    <radialGradient id="light" cx="0.5" cy="0" r="0.75">
      <stop offset="0" stop-color="#bfe4ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#bfe4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d4efff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#061433" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sea)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#light)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>
  </g>

  <!-- Each streak fades in from above and lands as a drop. The drops form the W. -->
  <g>
    <rect x="250" y="275" width="64" height="300" rx="32" fill="url(#streak)"/>
    <rect x="365" y="415" width="64" height="300" rx="32" fill="url(#streak)"/>
    <rect x="480" y="315" width="64" height="300" rx="32" fill="url(#streak)"/>
    <rect x="595" y="415" width="64" height="300" rx="32" fill="url(#streak)"/>
    <rect x="710" y="275" width="64" height="300" rx="32" fill="url(#streak)"/>
  </g>
  <g fill="#ffffff">
    <circle cx="282" cy="575" r="46"/>
    <circle cx="397" cy="715" r="46"/>
    <circle cx="512" cy="615" r="46"/>
    <circle cx="627" cy="715" r="46"/>
    <circle cx="742" cy="575" r="46"/>
  </g>
</svg>
